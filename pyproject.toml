[project]
name = "ham-checkin-assistant"
version = "0.9.4"
description = "江苏省中继 HAM 智能点名录入助手（纯本地，无 AI）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pywin32>=306; platform_system == 'Windows'",
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
    "pypinyin>=0.51",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pyinstaller>=6.0",
    "pillow>=10.0",  # 仅 _make_icon.py（构建图标）
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E501",      # 行宽由格式化处理
    "B008",      # 允许函数调用作默认参数
    "UP035",     # 允许 typing 导入
    # —— 既有代码库的紧凑写法（非数据安全问题）；新代码不应新增 ——
    "E702",      # 单行多语句（bench/pages/main_window 既有紧凑写法）
    "I001",      # 导入排序（既有写法）
    "B007",      # 未用循环变量
    "F841",      # 未用局部变量（旧代码遗留，保留以最小改动）
    "B905",      # zip 无严格参数
    "F541",      # f-string 无占位符
    "E741",      # 单字母变量 l/I/O
]

[tool.pytest.ini_options]
testpaths = ["tests"]
