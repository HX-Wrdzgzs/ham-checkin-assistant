name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install legacy test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify tag matches Native version
        shell: pwsh
        run: |
          [xml]$project = Get-Content native/src/HamCheckin.Native.App/HamCheckin.Native.App.csproj
          $version = ($project.Project.PropertyGroup.Version | Select-Object -First 1).ToString()
          $expected = "v$version"
          $actual = "${{ github.ref_name }}"
          Write-Host "Native version=$version, tag=$actual"
          if ($actual -ne $expected) { throw "Tag 与 Native 版本不一致：期望 $expected，实际 $actual" }

      - name: Run legacy regression suite
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Build and test Native solution
        shell: pwsh
        run: |
          dotnet restore native/HamCheckin.Native.sln
          dotnet restore native/src/HamCheckin.Native.App/HamCheckin.Native.App.csproj -r win-x64
          dotnet build native/HamCheckin.Native.sln -c Release --no-restore --verbosity:minimal
          dotnet test native/HamCheckin.Native.sln -c Release --no-build --logger "trx;LogFileName=native-tests.trx"

      - name: Publish Native self-contained EXE
        shell: pwsh
        run: |
          if (Test-Path release/native-publish) { Remove-Item release/native-publish -Recurse -Force }
          dotnet publish native/src/HamCheckin.Native.App/HamCheckin.Native.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -o release/native-publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true
          if (-not (Test-Path release/native-publish/HAM点名助手.exe)) {
            throw "Native 自包含 EXE 未生成"
          }

      - name: Prepare release metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content native/src/HamCheckin.Native.App/HamCheckin.Native.App.csproj
          $version = ($project.Project.PropertyGroup.Version | Select-Object -First 1).ToString()
          python release.py --exe release/native-publish/HAM点名助手.exe --version $version --tag "${{ github.ref_name }}" --manifest updates/latest.json

      - name: Create or refresh GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # GitHub API 会把非 ASCII 文件名归一化为 HAM.exe；ASCII 物理名
          # + 中文 label 仍能被旧客户端解析器识别。v1.0.0 的 Native 客户端
          # 也使用这个主资产，首次启动会自动备份并导入旧 Python 数据库。
          $legacyAsset = "release/HAM-legacy.exe#HAM点名助手.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/HAM.exe $legacyAsset release/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag release/HAM.exe $legacyAsset release/SHA256SUMS.txt --title $tag --generate-notes
          }

      - name: Publish stable update manifest to main
        shell: pwsh
        run: |
          Copy-Item updates/latest.json "$env:RUNNER_TEMP/latest.json"
          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Force updates | Out-Null
          Copy-Item "$env:RUNNER_TEMP/latest.json" updates/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update release manifest ${{ github.ref_name }}"
            git push origin HEAD:main
          }

      - name: Publish compatibility manifest for older clients
        shell: pwsh
        run: |
          # 旧客户端的备用 URL 指向这个过渡分支。至少在它们升级到新版
          # （改读 main）之前，每次正式 Release 都同步同一份真实 SHA256 清单。
          git fetch origin codex/ham-checkin-release
          git checkout -B codex/ham-checkin-release origin/codex/ham-checkin-release
          New-Item -ItemType Directory -Force updates | Out-Null
          Copy-Item "$env:RUNNER_TEMP/latest.json" updates/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update legacy release manifest ${{ github.ref_name }}"
            git push origin HEAD:codex/ham-checkin-release
          }
